<!DOCTYPE html>  
<html>
    <body> 
        <div style="color:red;font-size:50px;"> 
            Wlazło 3k<br>
            <script language="JavaScript">
                var x_wla=parseFloat(prompt("podaj argument x=","")); 
                document.write("czytany argument x="+x_wla.toFixed(2)+"<br>");     
        
                function f_wla(x) { 
                    if (x >= 2) return 9;
                    if (x > -2 && x < 0) return Math.pow(x + 1, 2);
                    if (x >= 0 && x < 2) return (x*x*x) + 1;
                    if (x <= -2) return 1;
                } 
        
                document.write(`f(${x_wla.toFixed(2)})=${f_wla(x_wla)}`); 
        
            </script> 
        </div> 
    </body> 
</html>
