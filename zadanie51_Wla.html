<!DOCTYPE html>   
    <head>    
        <title>Silnia Wlazlo </title>    
        <meta charset="utf-8">   
    </head>  
    <body> 
        <div style="color:red;font-size:50px;"> 
            <script language="JavaScript">
                do  {
                        var liczba1=prompt("podaj liczbę większą od 0=","");
                    }
                while(liczba1 < 0);
                var silnia_wla =1;
                    if(liczba1 != 0)
                        {
                            for(let i = 1; i <= liczba1; i++){
                                silnia_wla = silnia_wla * i;
                            }
                        }
                    document.write(liczba1 + " != " + silnia_wla)
            </script> 
        </div> 
    </body> 
</html>
