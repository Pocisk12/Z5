<html> 
    <body> 
        <div style="color:red;font-size:50px;"> 
            <script language="JavaScript">
            let koniec_petli_wlaz = parseInt(prompt("podaj konic pętli"))
            let i = 1;
            while(i<koniec_petli_wlaz) 
            { 
                if(i % 2 == 0){
                    document.write(i+"<br>");
                }
                i++;
            } 
            </script> 
        </div> 
    </body> 
</html>
