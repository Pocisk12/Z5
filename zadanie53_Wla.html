
<!DOCTYPE html> 
<html lang="pl"> 
    <head>  
    <meta charset="utf-8"> 
        <title>  Inisjaly Wlazlo </title> 
            <script language="JavaScript"> 
           var liczba_wla=prompt("ile razy powtórzyć","");
           var inicjały_wla=prompt("wpisz swoje inicjały","");
            for ( var i=1; i<=liczba_wla; i++) 
                { 
                for ( var k=1; k<=i; k++) 
                    { 
                    document.write("&nbsp&nbsp");     
                    } 
                    document.write(i +"_"+ inicjały_wla +"_"+ i +"<br>"); 
                } 
            </script> 
    </head>  
    <body>  
    </body>  
</html>
