<!DOCTYPE html>   
    <head>    
        <title>Sprawdzenie danych Wlazlo </title>    
        <meta charset="utf-8">
        <style>
            #Imie{
                color: blue;
            }
        </style>   
    </head>  
    <body> 
        <div style="color:blue;font-size:40px;"> 
        <script language="JavaScript">
        var L_wla=parseFloat(prompt("liczba = ",""));
            if(L_wla % 2 == 0){ 
                for(let i=1; i<=12; i++){
                    document.write("<p>Wlazlo</p>"+"<br>")
                }
            }
            else{
                for(let i=1; i<=12; i++){
                    document.write("<p id = \"Imie\">Nikodem</p>"+"<br>")
                }
            }
        </script> 
        </div> 
    </body> 
</html>
