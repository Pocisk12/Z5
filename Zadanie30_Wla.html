<html>
<head>
<script type="text/javascript">
var Wiezowiec = {
Pietra: '30',
Ulica: 'Nowatorska',
Wysokosc: '300m',
pokaz: function ()
{
document.write(this.Pietra + ' ' + this.Ulica + ' ' + this.Wysokosc)
}
}
Wiezowiec.pokaz();
</script>
</head>
<body>
<br>
Programowanie obiektowe. <br>
Obiekt to wiezowiec<br>
Pietra: <script>document.write(Wiezowiec.Pietra);</script><br>
Ulica: <script>document.write(Wiezowiec.Ulica);</script><br>
Wysokosc: <script>document.write(Wiezowiec.Wysokosc);</script><br>
metoda: <script>document.write(Wiezowiec.pokaz());</script><br>
</body>
</html>
