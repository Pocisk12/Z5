
<!DOCTYPE html> 
<html lang="pl"> 
    <head>  
    <meta charset="utf-8"> 
        <title>  Sigma Wlazlo </title>      
    </head>  
    <body>
        <div>
            <script language="JavaScript"> 
            let suma_wla=0;
            for(let i=1;i<=1000000;i++)
            {
                suma_wla = suma_wla+1 / i;
            }
            document.write("suma= "+ suma_wla.toFixed(2)+"<br>");
            </script>
        </div> 
    </body>  
</html>
