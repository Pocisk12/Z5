<!DOCTYPE html>   
    <head>    
        <title>Wlazlo </title>    
        <meta charset="utf-8">   
    </head>  
    <body> 
        <div style="color:red;font-size:50px;"> 
            <script language="JavaScript"> 
            do { 
                var liczba1=prompt("wysokość=",""); 
                var h_wla=parseFloat(liczba1); 
            } 
            while ( h_wla<=0); 
            do { 
                var liczba1=prompt("podstawę=",""); 
                var a_wla=parseFloat(liczba1); 
            while(!( a_wla>0));
            } 
            while(!( a_wla>0)); 
                var Pole=a_wla*h_wla/2; 
                document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>"); 
            </script> 
        </div> 
    </body> 
</html>
